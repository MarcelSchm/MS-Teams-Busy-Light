name: Create Release

on:
  push:
    branches:
      - main
    paths:
      - version.conf
    tags:
      - 'v_*.*.*.*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.resolve-tag.outputs.tag }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest

      - name: Create or select release tag
        id: resolve-tag
        shell: pwsh
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          $versionLine = Get-Content -LiteralPath "version.conf" |
              Select-String '^\s*Number\s*=\s*(\d+\.\d+\.\d+\.\d+)\s*$' |
              Select-Object -First 1
          if (-not $versionLine -or $versionLine.Line -notmatch '^\s*Number\s*=\s*(\d+\.\d+\.\d+\.\d+)\s*$') {
              throw "Could not read a valid version number from version.conf."
          }
          $tagName = "v_$($Matches[1])"

          if ($env:REF_TYPE -eq "tag") {
              if ($env:REF_NAME -ne $tagName) {
                  throw "Tag $env:REF_NAME does not match version.conf ($tagName)."
              }
              $tagName = $env:REF_NAME
          } else {
              if ($env:EVENT_NAME -eq "workflow_dispatch" -and $env:REF_NAME -ne "main") {
                  throw "Manual releases must be dispatched from main or an existing release tag."
              }

              git config user.name "github-actions[bot]"
              if ($LASTEXITCODE -ne 0) {
                  throw "Failed to configure the Git author name."
              }
              git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
              if ($LASTEXITCODE -ne 0) {
                  throw "Failed to configure the Git author email."
              }

              & .\create_changelog_and_tag.ps1 -Confirm:$false
              if ($LASTEXITCODE -ne 0) {
                  throw "Failed to create the release changelog and tag."
              }

              $remoteTag = git ls-remote --tags origin "refs/tags/$tagName"
              if ($LASTEXITCODE -ne 0 -or -not $remoteTag) {
                  throw "Release tag $tagName was not created on origin."
              }
          }

          "tag=$tagName" >> $env:GITHUB_OUTPUT

  release:
    needs: prepare
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ needs.prepare.outputs.tag }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Build Windows release package
        shell: pwsh
        run: .\createNewTeamsBusyLightExe.ps1

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          name: ${{ needs.prepare.outputs.tag }}
          body_path: changelog_currentVersion.md
          files: dist/MS_Teams_Busy_Light.zip
          fail_on_unmatched_files: true
          overwrite_files: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
