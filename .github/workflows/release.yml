name: Create Release

on:
  push:
    tags:
      - 'v_*.*.*.*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest

      - name: Build release package
        shell: pwsh
        run: ./createNewTeamsBusyLightExe.ps1

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          gh release create "$env:GITHUB_REF_NAME" .\dist\MS_Teams_Busy_Light.zip `
            --verify-tag `
            --title "$env:GITHUB_REF_NAME" `
            --notes-file changelog_currentVersion.md
